    // Clean Phone number helper
    function cleanPhone(phone) {
      let p = String(phone || '').replace(/[^0-9]/g, '');
      if (p.startsWith('0')) p = '62' + p.slice(1);
      if (p.startsWith('8')) p = '62' + p;
      return p;
    }

    function quickLogin(uid, pass) {
      document.getElementById('loginUserId').value = uid;
      document.getElementById('loginPassword').value = pass;
      handleLoginSubmit({ preventDefault: () => {} });
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const uid = document.getElementById('loginUserId').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();

      const user = appState.users.find(u => u.user_id === uid);
      if (!user) {
        alert('User ID tidak ditemukan. Silakan gunakan tombol demo instan.');
        return;
      }
      if (user.password && user.password !== pass) {
        alert('Password salah.');
        return;
      }

      appState.currentUser = user;
      renderApp();
    }

    function logout() {
      appState.currentUser = null;
      renderApp();
    }

    let tempAiData = null;

    async function triggerGeminiInsight(studentId) {
      const student = appState.users.find(u => u.user_id === studentId);
      const profile = appState.profil.find(p => p.murid_id === studentId) || {};
      const journal = document.getElementById('modalTeacherJournal').value;
      const btn = document.getElementById('btnGeminiGenerate');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menganalisis dengan AI...';

      try {
        // Coba panggil server endpoint jika tersedia, atau fallback client
        let responseData = null;
        try {
          const res = await fetch('/api/gemini/summarize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              studentName: student.nama_lengkap,
              className: student.kelas,
              hobbies: profile.hobi,
              goals: profile.cita_cita,
              learningStyle: profile.gaya_belajar,
              favoriteSubjects: profile.mapel_disukai,
              challengingSubjects: profile.mapel_menantang,
              independentObstacles: profile.kendala_belajar,
              teacherJournal: journal
            })
          });
          const json = await res.json();
          if (json.success && json.data) {
            responseData = json.data;
          }
        } catch (e) {
          console.log('Server endpoint offline, generating heuristic insight.');
        }

        if (!responseData) {
          responseData = {
            summaryPoints: [
              `Murid ${student.nama_lengkap} memiliki profil gaya belajar ${profile.gaya_belajar || 'visual'} dengan minat kuat pada cita-cita ${profile.cita_cita || 'masa depan'}.`,
              `Tantangan utama terdeteksi pada mapel ${(profile.mapel_menantang || []).join(', ') || 'tertentu'} dan kendala mandiri: ${profile.kendala_belajar || 'manajemen waktu'}.`,
              `Respons bimbingan positif dan terbuka untuk perbaikan berkala.`
            ],
            recommendations: [
              `Guru: Sediakan analogi visual/tutor sebaya untuk ${(profile.mapel_menantang || ['mapel menantang'])[0]}.`,
              `Orang Tua: Berikan apresiasi harian pada proses belajar di rumah.`
            ]
          };
        }

        tempAiData = responseData;
        const box = document.getElementById('aiResultBox');
        box.classList.remove('hidden');

        document.getElementById('aiSummaryPoints').innerHTML = '<strong>3 Poin Kunci:</strong><ul class="list-disc pl-4 mt-1">' +
          responseData.summaryPoints.map(p => `<li>${p}</li>`).join('') + '</ul>';

        document.getElementById('aiRecommendations').innerHTML = '<strong>2 Rekomendasi Strategi:</strong><ul class="list-disc pl-4 mt-1">' +
          responseData.recommendations.map(r => `<li>${r}</li>`).join('') + '</ul>';

      } catch (err) {
        alert('Gagal memproses AI: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-sparkles text-amber-300"></i> Generate AI Insight (Gemini)';
      }
    }

    function saveJournalEntry(studentId) {
      const student = appState.users.find(u => u.user_id === studentId);
      const journal = document.getElementById('modalTeacherJournal').value;

      const newSesi = {
        sesi_id: 'sesi_' + Date.now(),
        jenis_sesi: 'Personal',
        murid_id_list: [studentId],
        murid_nama_list: [student.nama_lengkap],
        inisiator: 'guru_wali',
        waktu_lokasi: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) + ' - Ruang Bimbingan',
        topik_kendala: 'Evaluasi & Refleksi Bimbingan Mandiri',
        status: 'Selesai',
        jurnal_guru: journal,
        ai_summary: tempAiData,
        created_at: new Date().toISOString()
      };

      appState.sesi.unshift(newSesi);
      saveState();
      alert('Jurnal dan hasil AI bimbingan berhasil disimpan!');
      closeJournalModal();
      renderTeacherPortal();
    }

    // --- EKSPOR PDF (jsPDF + autoTable) ---
    function exportStudentPDF(studentId) {
      const student = appState.users.find(u => u.user_id === studentId);
      const profile = appState.profil.find(p => p.murid_id === studentId) || {};
      const teacher = appState.users.find(u => u.user_id === student.guru_wali_id) || { nama_lengkap: 'Guru Wali Kelas' };
      const sessions = appState.sesi.filter(s => (s.murid_id_list || []).includes(studentId));

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      const pw = doc.getPageWidth();
      let y = 15;

      // Header Kop Surat
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.text('PEMERINTAH DAERAH PROVINSI - DINAS PENDIDIKAN', pw / 2, y, { align: 'center' });
      y += 5;
      doc.setFontSize(14);
      doc.setTextColor(15, 76, 129);
      doc.text('SMA NEGERI UNGGUL INDONESIA', pw / 2, y, { align: 'center' });
      y += 4.5;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.5);
      doc.setTextColor(100, 116, 139);
      doc.text('SISTEM INFORMASI MENTORING WALI KELAS (SIM-WALI)', pw / 2, y, { align: 'center' });
      y += 4;
      doc.setDrawColor(15, 76, 129);
      doc.setLineWidth(0.6);
      doc.line(14, y, pw - 14, y);
      y += 6;

      // Judul
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.setTextColor(15, 23, 42);
      doc.text('LEMBAR REKAM & PERKEMBANGAN MENTORING SISWA', pw / 2, y, { align: 'center' });
      y += 8;

      // Profil Tabel
      const pRows = [
        ['Nama Siswa', student.nama_lengkap],
        ['Kelas', student.kelas],
        ['Wali Kelas', teacher.nama_lengkap],
        ['Hobi & Minat', profile.hobi || 'Belum diisi'],
        ['Cita-cita / Karir', profile.cita_cita || 'Belum diisi'],
        ['Gaya Belajar', profile.gaya_belajar || 'Belum diisi'],
        ['Mapel Disukai', (profile.mapel_disukai || []).join(', ') || '-'],
        ['Mapel Menantang', (profile.mapel_menantang || []).join(', ') || '-'],
        ['Kendala Belajar', profile.kendala_belajar || 'Mandiri berjalan baik']
      ];

      doc.autoTable({
        startY: y,
        head: [['Aspek Profiling', 'Uraian & Refleksi Siswa']],
        body: pRows,
        theme: 'grid',
        headStyles: { fillColor: [15, 76, 129], textColor: [255, 255, 255], fontSize: 8.5 },
        bodyStyles: { fontSize: 8, cellPadding: 2 },
        columnStyles: { 0: { cellWidth: 45, fontStyle: 'bold' } },
        margin: { left: 14, right: 14 }
      });

      y = doc.lastAutoTable.finalY + 8;

      // Sesi Mentoring Tabel
      const sRows = sessions.map((s, idx) => [
        idx + 1,
        s.waktu_lokasi,
        s.topik_kendala,
        s.status,
        s.jurnal_guru || '-'
      ]);

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(15, 76, 129);
      doc.text('REKAPITULASI SESI BIMBINGAN WALI KELAS', 14, y);
      y += 3;

      doc.autoTable({
        startY: y,
        head: [['No', 'Waktu & Tempat', 'Topik / Agenda', 'Status', 'Catatan Guru']],
        body: sRows.length ? sRows : [['-', '-', 'Belum ada sesi tercatat', '-', '-']],
        theme: 'grid',
        headStyles: { fillColor: [30, 41, 59], textColor: [255, 255, 255], fontSize: 8 },
        bodyStyles: { fontSize: 7.5, cellPadding: 2 },
        margin: { left: 14, right: 14 }
      });

      y = doc.lastAutoTable.finalY + 12;

      // Tanda Tangan
      if (y > 230) { doc.addPage(); y = 20; }
      doc.setFontSize(8.5);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(51, 65, 85);
      doc.text('Orang Tua / Wali Murid', 40, y, { align: 'center' });
      doc.text('Guru Wali Kelas', pw - 50, y, { align: 'center' });
      y += 18;
      doc.setFont('helvetica', 'bold');
      doc.text('( ......................................... )', 40, y, { align: 'center' });
      doc.text(`( ${teacher.nama_lengkap} )`, pw - 50, y, { align: 'center' });

      doc.save(`Laporan_Mentoring_${student.nama_lengkap.replace(/\s+/g, '_')}.pdf`);
    }

    function exportClassMatrixPDF(className) {
      const teacher = appState.currentUser;
      const students = appState.users.filter(u => u.role === 'murid' && u.kelas === className);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('l', 'mm', 'a4');
      const pw = doc.getPageWidth();
      let y = 15;

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(14);
      doc.setTextColor(15, 76, 129);
      doc.text(`REKAPITULASI MATRIKS MENTORING KELAS ${className}`, pw / 2, y, { align: 'center' });
      y += 5;
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(100, 116, 139);
      doc.text(`Wali Kelas: ${teacher.nama_lengkap} • SMA Negeri Unggul Indonesia`, pw / 2, y, { align: 'center' });
      y += 6;

      const rows = students.map((s, idx) => {
        const p = appState.profil.find(pr => pr.murid_id === s.user_id) || {};
        const sess = appState.sesi.filter(se => (se.murid_id_list || []).includes(s.user_id));
        return [
          idx + 1,
          s.nama_lengkap,
          p.gaya_belajar || '-',
          p.cita_cita || '-',
          (p.mapel_menantang || []).join(', ') || 'Aman',
          sess.length + ' Sesi',
          p.kendala_belajar ? p.kendala_belajar.slice(0, 40) + '...' : 'Berjalan baik'
        ];
      });

      doc.autoTable({
        startY: y,
        head: [['No', 'Nama Siswa', 'Gaya Belajar', 'Cita-cita', 'Mapel Menantang', 'Total Sesi', 'Catatan Kendala']],
        body: rows,
        theme: 'grid',
        headStyles: { fillColor: [15, 76, 129], textColor: [255, 255, 255], fontSize: 8.5 },
        bodyStyles: { fontSize: 8, cellPadding: 2 },
        margin: { left: 14, right: 14 }
      });

      doc.save(`Matriks_Mentoring_Kelas_${className}.pdf`);
    }

    // --- MAIN RENDER ROUTER ---
    function renderApp() {
      renderNav();
      if (!appState.currentUser) {
        renderLoginView();
      } else if (appState.currentUser.role === 'guru_wali') {
        renderTeacherPortal();
      } else {
        renderStudentPortal();
      }
    }

    // Boot App
    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
